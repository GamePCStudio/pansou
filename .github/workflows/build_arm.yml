name: 交叉编译 arm/arm64 静态二进制

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.25"
            label: arm64
            goarch: arm64
            goarm: ""
            tagflag: ""
            note: sonic 原生 JIT（需要可执行内存）
          - toolchain: "1.25"
            label: arm64-nojit
            goarch: arm64
            goarm: ""
            tagflag: "-tags json_std"
            note: 强制 encoding/json，不生成机器码
          - toolchain: "1.26"
            label: arm64-nojit
            goarch: arm64
            goarm: ""
            tagflag: "-tags json_std"
            note: 同上，验证更新的 Go 工具链
          - toolchain: "1.25"
            label: armv7
            goarch: arm
            goarm: "7"
            tagflag: ""
            note: 32 位 ARMv7，sonic 不支持故自动走标准库
          - toolchain: "1.25"
            label: armv6
            goarch: arm
            goarm: "6"
            tagflag: ""
            note: 32 位 ARMv6 兜底
    env:
      BIN: pansou-linux-${{ matrix.label }}-go${{ matrix.toolchain }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go ${{ matrix.toolchain }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.toolchain }}

      - name: 目标与说明
        run: |
          go version
          echo "目标: GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} CGO_ENABLED=0 ${{ matrix.tagflag }}"
          echo "说明: ${{ matrix.note }}"

      - name: 下载依赖
        run: go mod download && go list -m github.com/bytedance/sonic github.com/Advik-B/cloudscraper github.com/dop251/goja

      - name: 确认 JSON 后端与 sonic 是否进入依赖图
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          echo "--- 本目标是否真的链接了 sonic:"
          go list -deps ${{ matrix.tagflag }} . | grep -c bytedance/sonic || echo "0（未链接 sonic）"
          echo "--- pansou/util/json 实际参与编译的文件:"
          go list -f 'build={{.GoFiles}}' ${{ matrix.tagflag }} pansou/util/json

      - name: 交叉编译
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            go build -trimpath ${{ matrix.tagflag }} -ldflags="-s -w" -o "$BIN" .
          ls -lh "$BIN"
          file "$BIN"
          sha256sum "$BIN" | tee "$BIN.sha256"

      - name: 安装 qemu-user
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user qemu-user-static
          for c in qemu-aarch64 qemu-arm qemu-aarch64-static qemu-arm-static; do
            command -v "$c" && echo "found $c"
          done

      - name: 冒烟测试（qemu-user 下真实启动并请求 /api/health）
        continue-on-error: true
        run: |
          set -x
          mkdir -p /tmp/ps
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            for c in qemu-aarch64 qemu-aarch64-static; do command -v "$c" >/dev/null && QEMU="$c -cpu max" && break; done
          else
            for c in qemu-arm qemu-arm-static; do command -v "$c" >/dev/null && QEMU="$c -cpu max" && break; done
          fi
          echo "使用模拟器: $QEMU"
          env \
            PORT=8899 \
            CACHE_PATH=/tmp/ps/cache \
            CHANNELS=tgsearchers7 \
            ENABLED_PLUGINS="" \
            CONCURRENCY=5 \
            OUTBOUND_MAX_CONCURRENCY=8 \
            ASYNC_MAX_BACKGROUND_WORKERS=4 \
            HTTP_MAX_CONNS=32 \
            $QEMU "$GITHUB_WORKSPACE/$BIN" > /tmp/ps/run.log 2>&1 &
          BGPID=$!
          CODE=000
          for i in $(seq 1 25); do
            sleep 2
            CODE=$(curl -s -o /tmp/ps/health.json -w "%{http_code}" http://127.0.0.1:8899/api/health || echo 000)
            [ "$CODE" = "200" ] && { echo "=== HEALTH 200，第 $i 次探测成功 ==="; break; }
            kill -0 $BGPID 2>/dev/null || { echo "=== 进程已退出，第 $i 次 ==="; break; }
          done
          echo "=== health http_code=$CODE ==="
          head -c 1500 /tmp/ps/health.json 2>/dev/null || echo "(health 无内容)"
          for kw in "%E7%94%B5%E5%BD%B1" "%E7%BB%BC%E8%89%BA"; do
            echo; echo "=== 真实搜索 src=tg kw=$kw ==="
            curl -s -m 60 "http://127.0.0.1:8899/api/search?kw=${kw}&res=merge&src=tg" -o /tmp/ps/search.json -w "http=%{http_code} bytes=%{size_download}\n" || echo "(search 失败)"
            head -c 400 /tmp/ps/search.json 2>/dev/null || true
            echo
          done
          echo; echo "=== 后台补齐等待（TG backfill 会再写一次缓存，正是 32 位对齐最容易炸的路径） ==="
          sleep 12
          kill -0 $BGPID 2>/dev/null && echo "进程仍存活" || echo "进程已退出"
          curl -s -o /dev/null -w "二次 health http=%{http_code}\n" -m 15 http://127.0.0.1:8899/api/health || true
          echo; echo "=== run.log 全文 ==="; cat /tmp/ps/run.log
          echo; echo "=== 崩溃判定 ==="
          if grep -qE "^panic:|fatal error|unaligned 64-bit" /tmp/ps/run.log; then
            echo "RESULT: PANIC_DETECTED"; grep -nE "^panic:|fatal error|unaligned 64-bit|atomic_arm|sharded_memory_cache" /tmp/ps/run.log | head -12
            exit 1
          else
            echo "RESULT: NO_PANIC"
          fi
          kill $BGPID 2>/dev/null || true

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}
          path: |
            ${{ env.BIN }}
            ${{ env.BIN }}.sha256
          if-no-files-found: error
          retention-days: 30
